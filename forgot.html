<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CostPulse — Forgot passcode</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="center">
    <div class="card">
      <img src="logo.svg" alt="CostPulse logo" class="logo" />
      <h1>Reset passcode</h1>

      <form id="forgotForm">
        <label for="emailreset">Email</label>
        <input id="emailreset" name="emailreset" type="email" required />

        <p class="muted">We'll send a passcode reset link to your email.</p>

        <div class="row between">
          <a href="index.html" class="btn-link">Back to login</a>
        </div>

        <button class="primary" type="submit">Send reset link</button>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
