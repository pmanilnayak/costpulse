<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CostPulse — Sign up</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="center">
    <div class="card">
      <img src="logo.svg" alt="CostPulse logo" class="logo" />
      <h1>Create your account</h1>

      <form id="signupForm">
        <label for="fullname">Full name</label>
        <input id="fullname" name="fullname" type="text" required />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />

        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" pattern="[0-9+\- ()]{7,}" />

        <label for="signpass">Password</label>
        <div class="pw-row">
          <input id="signpass" name="signpass" type="password" required />
          <button id="toggleSignPw" type="button" aria-label="Show password">Show</button>
        </div>

        <label for="repass">Retype password</label>
        <input id="repass" name="repass" type="password" required />

        <div class="row between">
          <a href="index.html" class="btn-link">Back to login</a>
        </div>

        <button class="primary" type="submit">Sign up</button>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
